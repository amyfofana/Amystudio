<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #FDEFF3; -webkit-font-smoothing: antialiased; }
  a { color: #C43B6B; text-decoration: none; }
  a:hover { color: #5E1F3A; }
</style>
</helmet>

<div style="min-height: 100vh; background: #FDEFF3; color: #33131F; font-family: 'Bricolage Grotesque', -apple-system, sans-serif; padding: 20px; box-sizing: border-box;">

  <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;">

    <div style="background: #FFFFFF; border-radius: 28px; padding: 14px 14px 14px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
      <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.6px;">Amy Studio</span>
      <div style="display: flex; gap: 4px;">
        <span style="padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #33131F; color: #FFF0F5;">Dashboard</span>
        <span style="padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; color: #8A6274;">Calendrier</span>
        <span style="padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; color: #8A6274;">Board</span>
        <span style="padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; color: #8A6274;">Canada</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px;">
      <div style="grid-column: span 2; min-width: 0; background: linear-gradient(140deg, #FF6FA0 0%, #C43B6B 100%); border-radius: 28px; padding: 34px 32px; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 26px; min-height: 210px;">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.2px; opacity: 0.85;">Vendredi 11 septembre</span>
        <h1 style="margin: 0; font-size: 40px; line-height: 1.05; letter-spacing: -1.6px; font-weight: 800; max-width: 440px;">3 tournages et ta semaine est bouclée.</h1>
        <span style="align-self: flex-start; padding: 11px 20px; border-radius: 999px; background: rgba(255,255,255,0.22); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 260ms cubic-bezier(0.4,0,0.2,1);" style-hover="background: #FFFFFF; color: #C43B6B">Commencer →</span>
      </div>

      <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
        <div style="background: {{ s.bg }}; border-radius: 28px; padding: 24px 26px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 98px; cursor: default; transition: all 260ms cubic-bezier(0.4,0,0.2,1);" style-hover="transform: translateY(-4px)">
          <span style="font-size: 13.5px; font-weight: 600; color: #8A6274;">{{ s.label }}</span>
          <span style="font-size: 44px; font-weight: 800; letter-spacing: -2.2px; line-height: 1; color: {{ s.fg }};">{{ s.value }}</span>
        </div>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 28px; padding: 26px 24px 28px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
        <h2 style="margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.8px;">Pipeline</h2>
        <span style="font-size: 13px; color: #8A6274;">Glisse une carte pour changer son statut</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; align-items: start;">
        <sc-for list="{{ columns }}" as="col" hint-placeholder-count="4">
          <div style="background: #FDEFF3; border-radius: 22px; padding: 14px 12px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 210px;">
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 6px;">
              <span style="font-size: 13.5px; font-weight: 700; letter-spacing: -0.2px;">{{ col.title }}</span>
              <span style="font-size: 12px; font-weight: 600; color: #FFFFFF; background: {{ col.color }}; border-radius: 999px; min-width: 20px; text-align: center; padding: 2px 7px;">{{ col.count }}</span>
            </div>
            <sc-for list="{{ col.posts }}" as="p" hint-placeholder-count="2">
              <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: grab; transition: all 260ms cubic-bezier(0.4,0,0.2,1);" style-hover="transform: translateY(-3px) rotate(-0.6deg); box-shadow: 0 10px 24px rgba(196,59,107,0.14)">
                <span style="font-size: 14.5px; font-weight: 500; line-height: 1.35; letter-spacing: -0.2px;">{{ p.title }}</span>
                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                  <span style="font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: #FDEFF3; color: #8A6274;">{{ p.format }}</span>
                  <span style="font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: {{ p.effortBg }}; color: {{ p.effortFg }};">{{ p.effort }}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      stats: [
        { label: 'À filmer', value: '3', bg: '#FFFFFF', fg: '#C43B6B' },
        { label: 'En production', value: '4', bg: '#FFE3EC', fg: '#33131F' },
        { label: 'Postés', value: '1', bg: '#FFFFFF', fg: '#33131F' },
        { label: 'Idées au total', value: '8', bg: '#F3E3FB', fg: '#33131F' }
      ],
      columns: [
        { title: 'À filmer', count: '3', color: '#FF6FA0', posts: [
          { title: 'GRWM première soirée à Montréal', format: 'GRWM', effort: 'Moyen', effortBg: '#FFE3EC', effortFg: '#C43B6B' },
          { title: 'Haul pharmacie canadienne', format: 'Haul', effort: 'Moyen', effortBg: '#FFE3EC', effortFg: '#C43B6B' },
          { title: 'Routine skincare grand froid', format: 'Tuto', effort: 'Élevé', effortBg: '#33131F', effortFg: '#FFF0F5' }
        ]},
        { title: 'À monter', count: '2', color: '#C43B6B', posts: [
          { title: '3 produits qui survivent au -20°', format: 'Review', effort: 'Faible', effortBg: '#F3E3FB', effortFg: '#7A4A8F' },
          { title: 'Transition blush rose ↔ érable', format: 'Transition', effort: 'Élevé', effortBg: '#33131F', effortFg: '#FFF0F5' }
        ]},
        { title: 'À poster', count: '2', color: '#8A6274', posts: [
          { title: 'Ma trousse de voyage minimaliste', format: 'Vlog', effort: 'Faible', effortBg: '#F3E3FB', effortFg: '#7A4A8F' },
          { title: "Nail art feuilles d'automne", format: 'Tuto', effort: 'Moyen', effortBg: '#FFE3EC', effortFg: '#C43B6B' }
        ]},
        { title: 'Postés', count: '1', color: '#33131F', posts: [
          { title: 'Coiffure anti-tuque', format: 'Tuto', effort: 'Faible', effortBg: '#F3E3FB', effortFg: '#7A4A8F' }
        ]}
      ]
    };
  }
}

</script>
</body>
</html>
